<h1>Folha de contato — os tres iniciais</h1>
<p class="sub">Tudo <b>animado de verdade</b>: idle de dois quadros com fase propria por unidade, e as auras pulsando.
Do lado de cada um, o tamanho real no mapa. Nada disso esta no jogo ainda.</p>

<script>
function montar(p,r,s){
  const w=Math.max(...r.map(l=>l.length)), h=r.length;
  const c=document.createElement('canvas'); c.width=w*s; c.height=h*s;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++){const li=r[y];
    for(let x=0;x<li.length;x++){const cor=p[li[x]]; if(!cor)continue;
      g.fillStyle=cor; g.fillRect(x*s,y*s,s,s);}}
  return c;
}
function respirar(r,pes){
  const larg=Math.max(...r.map(l=>l.length));
  const corte=r.length-pes;
  return ['.'.repeat(larg), ...r.slice(0,corte-1), ...r.slice(corte)];
}
/* ============ SISTEMA DE AURAS (padrao do jogo) ============
   A aura diz o STATUS da unidade a distancia, sem texto e sem sprite novo.
   Ideia dele: cor por categoria. Lendario+Mega mistura as duas cores.      */
const AURAS={
  final:      {n:'Forma final', cores:['#3d7dd8'],           forca:.75},
  mega:       {n:'Mega',        cores:['#e8453c'],           forca:1},
  gigantamax: {n:'Gigantamax',  cores:['#ffcb05'],           forca:1.1},
  lendario:   {n:'Lendario',    cores:['#a86fd6'],           forca:1},
  lendmega:   {n:'Lendario+',   cores:['#a86fd6','#e8453c'], forca:1.2}
};
/* desenha a aura sob a unidade. `t` = tempo em ms, pra pulsar. */
function desenharAura(g,cx,cy,raio,tipo,t,fase){
  const A=AURAS[tipo]; if(!A) return;
  const pulso=.5+.5*Math.sin(t/380+(fase||0));
  const r=raio*(1+pulso*.06);
  if(A.cores.length===1){
    const c=A.cores[0];
    const grad=g.createRadialGradient(cx,cy,r*.2,cx,cy,r);
    grad.addColorStop(0,  hexA(c,(.34+pulso*.26)*A.forca));
    grad.addColorStop(.58,hexA(c,(.14+pulso*.14)*A.forca));
    grad.addColorStop(1,  hexA(c,0));
    g.fillStyle=grad;
    g.beginPath(); g.arc(cx,cy,r,0,6.283); g.fill();
  } else {
    /* duas cores: uma gira por dentro da outra */
    const [c1,c2]=A.cores;
    const g1=g.createRadialGradient(cx,cy,r*.2,cx,cy,r);
    g1.addColorStop(0,  hexA(c1,(.32+pulso*.24)*A.forca));
    g1.addColorStop(.6, hexA(c1,(.12+pulso*.12)*A.forca));
    g1.addColorStop(1,  hexA(c1,0));
    g.fillStyle=g1; g.beginPath(); g.arc(cx,cy,r,0,6.283); g.fill();
    const ang=t/620+(fase||0), dx=Math.cos(ang)*r*.22, dy=Math.sin(ang)*r*.22;
    const g2=g.createRadialGradient(cx+dx,cy+dy,r*.12,cx+dx,cy+dy,r*.72);
    g2.addColorStop(0, hexA(c2,(.30+(1-pulso)*.26)*A.forca));
    g2.addColorStop(1, hexA(c2,0));
    g.fillStyle=g2; g.beginPath(); g.arc(cx+dx,cy+dy,r*.72,0,6.283); g.fill();
  }
}
function hexA(h,a){
  const n=parseInt(h.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+Math.max(0,Math.min(1,a)).toFixed(3)+')';
}

const DEMO_AURA=[['final','Forma final'],['mega','Mega'],['gigantamax','Gigantamax'],
                 ['lendario','Lendario'],['lendmega','Lendario + Mega']];

const animados=[];
function celula(rows,pal,pes,aura,esc,naGrama){
  const a=montar(pal,rows,esc), b=montar(pal,respirar(rows,pes),esc);
  const cv=document.createElement('canvas');
  cv.width=a.width+esc*10; cv.height=a.height+esc*10;
  if(naGrama) cv.className='grama';
  const g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
  animados.push({g,a,b,cv,aura,fase:Math.random()*6.283});
  return cv;
}
const out=document.getElementById('saida');
for(const [titulo,itens] of FICHA){
  const h=document.createElement('h2'); h.textContent=titulo; out.appendChild(h);
  const div=document.createElement('div'); div.className='linha';
  for(const [nome,rows,pal,pes,aura] of itens){
    for(const [esc,naGrama,rot] of [[7,false,''],[2,true,'tamanho real']]){
      const c=document.createElement('div'); c.className='cel';
      c.appendChild(celula(rows,pal,pes,aura,esc,naGrama));
      const b=document.createElement('b'); b.textContent=nome; c.appendChild(b);
      if(rot){const i=document.createElement('i');i.textContent=rot;c.appendChild(i);}
      div.appendChild(c);
    }
  }
  out.appendChild(div);
}

  c.appendChild(celula(lucario,P_RIOLU,2,tipo,4,false));
  const b=document.createElement('b'); b.textContent=rot; c.appendChild(b);
  dv.appendChild(c);
}
out.appendChild(dv);

function quadro(){
  const t=performance.now();
  for(const o of animados){
    const g=o.g, cv=o.cv;
    g.clearRect(0,0,cv.width,cv.height);
    if(o.aura) desenharAura(g,cv.width/2,cv.height/2,Math.min(cv.width,cv.height)*.52,o.aura,t,o.fase);
    const f=(Math.floor(t/420+o.fase)%2)===0 ? o.a : o.b;
    g.drawImage(f,(cv.width-o.a.width)/2,(cv.height-o.a.height)/2);
  }
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
